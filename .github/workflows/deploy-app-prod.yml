name: Deploy App Prod

on:
  repository_dispatch:
    types: [deploy-app-prod, deploy-prod]
  workflow_dispatch:
    inputs:
      backend_image:
        description: Full backend image URI (SHA tag)
        required: true
      frontend_image:
        description: Full frontend image URI (SHA tag)
        required: true
      ai_image:
        description: Full AI service image URI (SHA tag)
        required: false
      source_sha:
        description: App repo commit SHA
        required: false

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Resolve image tags
        id: images
        run: |
          if [ "${{ github.event_name }}" = "repository_dispatch" ]; then
            echo "backend=${{ github.event.client_payload.backend_image }}" >> "$GITHUB_OUTPUT"
            echo "frontend=${{ github.event.client_payload.frontend_image }}" >> "$GITHUB_OUTPUT"
            echo "ai=${{ github.event.client_payload.ai_image }}" >> "$GITHUB_OUTPUT"
            echo "source_sha=${{ github.event.client_payload.source_sha }}" >> "$GITHUB_OUTPUT"
          else
            echo "backend=${{ inputs.backend_image }}" >> "$GITHUB_OUTPUT"
            echo "frontend=${{ inputs.frontend_image }}" >> "$GITHUB_OUTPUT"
            echo "ai=${{ inputs.ai_image }}" >> "$GITHUB_OUTPUT"
            echo "source_sha=${{ inputs.source_sha }}" >> "$GITHUB_OUTPUT"
          fi

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_INFRA_DEPLOY_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Deploy backend to Cloud Run
        run: |
          gcloud run services update prod-mhcet-backend \
            --project="${{ vars.GCP_PROJECT_ID }}" \
            --region="${{ vars.GCP_REGION }}" \
            --image="${{ steps.images.outputs.backend }}"

      - name: Deploy frontend to Cloud Run
        run: |
          gcloud run services update prod-mhcet-frontend \
            --project="${{ vars.GCP_PROJECT_ID }}" \
            --region="${{ vars.GCP_REGION }}" \
            --image="${{ steps.images.outputs.frontend }}"

      - name: Deploy AI service to Cloud Run
        if: steps.images.outputs.ai != ''
        run: |
          gcloud run services update prod-mhcet-ai \
            --project="${{ vars.GCP_PROJECT_ID }}" \
            --region="${{ vars.GCP_REGION }}" \
            --image="${{ steps.images.outputs.ai }}"

      - name: Smoke test health
        run: |
          curl --fail --retry 8 --retry-delay 10 "${{ vars.API_HEALTH_URL_PROD }}"

      - name: Smoke test database-backed API
        run: |
          count=$(curl --fail --retry 5 --retry-delay 5 \
            "${{ vars.API_BASE_URL_PROD }}/districts" | jq 'length')
          if [ "$count" -lt 1 ]; then
            echo "Expected districts data, got count=$count"
            exit 1
          fi
          echo "Districts returned: $count"
