name: Build Stress Test Image Dev

on:
  workflow_dispatch:
  push:
    branches: [dev]
    paths:
      - "stress-test/**"
      - ".github/workflows/build-stress-test-dev.yml"

permissions:
  contents: read
  id-token: write

concurrency:
  group: build-stress-test-dev
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    environment: dev-infra
    steps:
      - uses: actions/checkout@v4

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_INFRA_DEPLOY_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v2

      - uses: docker/setup-buildx-action@v3

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ vars.GCP_REGION }}-docker.pkg.dev --quiet

      - name: Build and push stress-test image
        uses: docker/build-push-action@v6
        with:
          context: ./stress-test
          push: true
          tags: |
            ${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/mhcet/stress-test:dev-${{ github.sha }}
            ${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/mhcet/stress-test:dev-latest
