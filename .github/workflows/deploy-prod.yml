name: Deploy Prod

on:
  repository_dispatch:
    types: [deploy-prod]
  pull_request:
    types: [closed]
    branches: [main]
    paths:
      - "terraform/**"
  workflow_dispatch:
    inputs:
      backend_image:
        description: Full backend image URI
        required: true
      frontend_image:
        description: Full frontend image URI
        required: true
      source_sha:
        description: App repo commit SHA
        required: false

permissions:
  contents: read
  id-token: write

jobs:
  deploy-app:
    if: github.event_name == 'repository_dispatch' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment: production
    env:
      TF_IN_AUTOMATION: true
    steps:
      - uses: actions/checkout@v4

      - name: Resolve image tags
        id: images
        run: |
          if [ "${{ github.event_name }}" = "repository_dispatch" ]; then
            echo "backend=${{ github.event.client_payload.backend_image }}" >> "$GITHUB_OUTPUT"
            echo "frontend=${{ github.event.client_payload.frontend_image }}" >> "$GITHUB_OUTPUT"
            echo "source_sha=${{ github.event.client_payload.source_sha }}" >> "$GITHUB_OUTPUT"
          else
            echo "backend=${{ inputs.backend_image }}" >> "$GITHUB_OUTPUT"
            echo "frontend=${{ inputs.frontend_image }}" >> "$GITHUB_OUTPUT"
            echo "source_sha=${{ inputs.source_sha }}" >> "$GITHUB_OUTPUT"
          fi

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_INFRA_DEPLOY_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v2

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8

      - name: Terraform Apply
        working-directory: terraform/environments/prod
        run: |
          terraform init -input=false
          terraform apply -input=false -auto-approve \
            -var="project_id=${{ vars.GCP_PROJECT_ID }}" \
            -var="backend_image=${{ steps.images.outputs.backend }}" \
            -var="frontend_image=${{ steps.images.outputs.frontend }}"

      - name: Smoke test
        run: |
          curl --fail --retry 5 --retry-delay 10 "${{ vars.API_HEALTH_URL_PROD }}"

  deploy-infra:
    if: github.event_name == 'pull_request' && github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    environment: production
    env:
      TF_IN_AUTOMATION: true
    steps:
      - uses: actions/checkout@v4

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_INFRA_DEPLOY_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v2

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8

      - name: Terraform Apply infra changes
        working-directory: terraform/environments/prod
        run: |
          terraform init -input=false
          terraform apply -input=false -auto-approve \
            -var="project_id=${{ vars.GCP_PROJECT_ID }}" \
            -var="backend_image=${{ vars.CURRENT_BACKEND_IMAGE_PROD }}" \
            -var="frontend_image=${{ vars.CURRENT_FRONTEND_IMAGE_PROD }}"
