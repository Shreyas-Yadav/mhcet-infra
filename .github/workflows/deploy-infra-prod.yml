name: Deploy Infra Prod

on:
  workflow_dispatch:
  pull_request:
    types: [closed]
    branches: [main]
    paths:
      - "terraform/**"

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-infra-prod
  cancel-in-progress: false

jobs:
  apply:
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.pull_request.merged == true)
    runs-on: ubuntu-latest
    environment: production-infra
    env:
      TF_IN_AUTOMATION: true
    steps:
      - uses: actions/checkout@v4

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_INFRA_DEPLOY_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v2

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8

      - name: Terraform Plan
        working-directory: terraform/environments/prod
        run: |
          terraform init -input=false
          terraform plan -input=false -no-color -out=tfplan \
            -var="project_id=${{ vars.GCP_PROJECT_ID }}" \
            -var="region=${{ vars.GCP_REGION }}" \
            -var="frontend_domain=${{ vars.FRONTEND_DOMAIN_PROD }}" \
            -var="backend_domain=${{ vars.BACKEND_DOMAIN_PROD }}" \
            -var="cors_allowed_origins=${{ vars.CORS_ALLOWED_ORIGINS_PROD }}" \
            -var="backend_health_url=${{ vars.API_HEALTH_URL_PROD }}" \
            -var="alert_email=${{ vars.ALERT_EMAIL }}" \
            -var="backend_image=${{ vars.CURRENT_BACKEND_IMAGE_PROD }}" \
            -var="frontend_image=${{ vars.CURRENT_FRONTEND_IMAGE_PROD }}" \
            -var="ai_image=${{ vars.CURRENT_AI_IMAGE_PROD }}" \
            -var="ai_domain=${{ vars.AI_DOMAIN_PROD }}"

      - name: Terraform Apply
        working-directory: terraform/environments/prod
        run: |
          terraform apply -input=false -auto-approve tfplan
