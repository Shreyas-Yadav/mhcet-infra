name: Deploy Infra Dev

on:
  workflow_dispatch:
  push:
    branches: [dev]
    paths:
      - "terraform/**"
      - ".github/workflows/deploy-infra-dev.yml"

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-infra-dev
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    environment: dev-infra
    env:
      TF_IN_AUTOMATION: true
    steps:
      - uses: actions/checkout@v4

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_INFRA_DEPLOY_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v2

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8

      - name: Drop orphaned stress job from state (one-time rename recovery)
        continue-on-error: true
        working-directory: terraform/environments/dev
        run: |
          terraform init -input=false
          terraform state rm 'module.stress_test[0].google_cloud_run_v2_job.stress_test'

      - name: Terraform Plan
        working-directory: terraform/environments/dev
        run: |
          terraform init -input=false
          EXTRA_VARS=""
          [ -n "${{ vars.CURRENT_BACKEND_IMAGE_DEV }}" ] && EXTRA_VARS="$EXTRA_VARS -var=backend_image=${{ vars.CURRENT_BACKEND_IMAGE_DEV }}"
          [ -n "${{ vars.CURRENT_FRONTEND_IMAGE_DEV }}" ] && EXTRA_VARS="$EXTRA_VARS -var=frontend_image=${{ vars.CURRENT_FRONTEND_IMAGE_DEV }}"
          [ -n "${{ vars.CURRENT_AI_IMAGE_DEV }}" ] && EXTRA_VARS="$EXTRA_VARS -var=ai_image=${{ vars.CURRENT_AI_IMAGE_DEV }}"
          [ -n "${{ vars.AI_DOMAIN_DEV }}" ] && EXTRA_VARS="$EXTRA_VARS -var=ai_domain=${{ vars.AI_DOMAIN_DEV }}"
          terraform plan -input=false -no-color -out=tfplan \
            -var="project_id=${{ vars.GCP_PROJECT_ID }}" \
            -var="region=${{ vars.GCP_REGION }}" \
            -var="frontend_domain=${{ vars.FRONTEND_DOMAIN_DEV }}" \
            -var="backend_domain=${{ vars.BACKEND_DOMAIN_DEV }}" \
            -var="cors_allowed_origins=${{ vars.CORS_ALLOWED_ORIGINS_DEV }}" \
            -var="backend_health_url=${{ vars.API_HEALTH_URL_DEV }}" \
            -var="alert_email=${{ vars.ALERT_EMAIL }}" \
            -var="stress_test_enabled=${{ vars.STRESS_TEST_ENABLED == 'true' }}" \
            -var="rate_limit_requests_per_minute=${{ vars.RATE_LIMIT_REQUESTS_PER_MINUTE || 100 }}" \
            $EXTRA_VARS

      - name: Terraform Apply
        working-directory: terraform/environments/dev
        run: terraform apply -input=false -auto-approve tfplan
