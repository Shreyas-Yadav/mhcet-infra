name: Terraform Plan

on:
  pull_request:
    branches: [dev, main]
    paths:
      - "terraform/**"
      - ".github/workflows/plan.yml"

permissions:
  contents: read
  pull-requests: write
  id-token: write

jobs:
  plan:
    runs-on: ubuntu-latest
    env:
      TF_IN_AUTOMATION: true
    steps:
      - uses: actions/checkout@v4

      - name: Determine environment
        id: env
        run: |
          if [ "${{ github.base_ref }}" = "main" ]; then
            echo "environment=prod" >> "$GITHUB_OUTPUT"
            echo "working_dir=terraform/environments/prod" >> "$GITHUB_OUTPUT"
          else
            echo "environment=dev" >> "$GITHUB_OUTPUT"
            echo "working_dir=terraform/environments/dev" >> "$GITHUB_OUTPUT"
          fi

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_INFRA_DEPLOY_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v2

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8

      - name: Terraform Init
        working-directory: ${{ steps.env.outputs.working_dir }}
        run: terraform init -input=false

      - name: Set plan variables
        id: tfvars
        run: |
          if [ "${{ steps.env.outputs.environment }}" = "prod" ]; then
            echo "frontend_domain=${{ vars.FRONTEND_DOMAIN_PROD }}" >> "$GITHUB_OUTPUT"
            echo "backend_domain=${{ vars.BACKEND_DOMAIN_PROD }}" >> "$GITHUB_OUTPUT"
            echo "cors_allowed_origins=${{ vars.CORS_ALLOWED_ORIGINS_PROD }}" >> "$GITHUB_OUTPUT"
          else
            echo "frontend_domain=${{ vars.FRONTEND_DOMAIN_DEV }}" >> "$GITHUB_OUTPUT"
            echo "backend_domain=${{ vars.BACKEND_DOMAIN_DEV }}" >> "$GITHUB_OUTPUT"
            echo "cors_allowed_origins=${{ vars.CORS_ALLOWED_ORIGINS_DEV }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Terraform Plan
        id: plan
        working-directory: ${{ steps.env.outputs.working_dir }}
        run: |
          terraform plan -input=false -no-color \
            -var="project_id=${{ vars.GCP_PROJECT_ID }}" \
            -var="region=${{ vars.GCP_REGION }}" \
            -var="frontend_domain=${{ steps.tfvars.outputs.frontend_domain }}" \
            -var="backend_domain=${{ steps.tfvars.outputs.backend_domain }}" \
            -var="cors_allowed_origins=${{ steps.tfvars.outputs.cors_allowed_origins }}" \
            -var="backend_image=${{ vars.PLAN_BACKEND_IMAGE }}" \
            -var="frontend_image=${{ vars.PLAN_FRONTEND_IMAGE }}" \
            -out=tfplan 2>&1 | tee plan.txt
        continue-on-error: true

      - name: Comment plan on PR
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const planPath = '${{ steps.env.outputs.working_dir }}/plan.txt';
            let plan = 'Plan output unavailable.';
            try {
              plan = fs.readFileSync(planPath, 'utf8');
            } catch (e) {}
            const trimmed = plan.length > 60000 ? plan.slice(-60000) : plan;
            const body = `## Terraform Plan (${{ steps.env.outputs.environment }})\n\n\`\`\`\n${trimmed}\n\`\`\``;
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body
            });

      - name: Fail if plan failed
        if: steps.plan.outcome == 'failure'
        run: exit 1
